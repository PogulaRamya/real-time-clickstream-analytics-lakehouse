version: 2
models:
  - name: fct_product_minute
    description: One row per UTC minute and product. Updates replace previous aggregates.
    columns:
      - name: window_start
        tests: [not_null]
      - name: product_id
        tests: [not_null]
  - name: fct_sessions
    description: Finalized 30-minute inactivity sessions. Funnel requires ordered stages.
    columns:
      - name: session_id
        tests: [not_null, unique]
      - name: funnel_stage
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4]
              quote: false
  - name: conversion_funnel
    description: UTC daily finalized-session funnel. Conversion denominator is product-view sessions.
  - name: product_performance
    description: Product event metrics in USD. Purchases-per-view is not a user conversion rate.
seeds:
  - name: product_catalog
    description: Small editable example catalog for SCD2 demonstration; not an exhaustive SKU dimension.
    columns:
      - name: product_id
        tests: [unique, not_null]
